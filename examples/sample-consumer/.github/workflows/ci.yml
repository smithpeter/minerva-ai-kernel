name: CI (intentionally failing)

# This workflow lives in the sample-consumer template. When copied
# to a consumer repo's root, it runs failing-build.sh and uploads
# the captured log as a build artifact. The minerva-diagnose
# workflow then picks the log up.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Run failing build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the build (will fail)
        id: build
        shell: bash
        run: |
          set +e
          bash failing-build.sh 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "${exit_code}"

      - name: Upload build log
        if: ${{ always() && hashFiles('build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7
