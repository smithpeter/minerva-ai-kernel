[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva-ai-kernel"
version = "0.0.0"
description = "CPU-local failure interpreter for CI/CD, agents, and ops."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Minerva Maintainers", email = "maintainers@minervakernel.com" }
]
dependencies = []

[project.scripts]
minerva = "minerva_kernel.cli:main"

[tool.setuptools.packages.find]
include = ["minerva_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
